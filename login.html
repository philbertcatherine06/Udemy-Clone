<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Udemy Clone</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="notice">
        Student project
    </div>

    <div class="login">

        <div class="login__left">
            <img src="./images/login banner.jpeg" alt="Login illustration">
        </div>

        <div class="login__right">
            <p class="login__title">Log in to continue your learning journey</p>

            <input class="login__input" type="text" placeholder="Email or Phone Number">

            <button class="login__btn">Continue</button>

            <div class="login__or">
                <p>Other log in options</p>
            </div>

            <div class="login__social">
                <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="22"></a>
                <a href="#"><span class="fa-brands fa-facebook"></span></a>
                <a href="#"><span class="fa-brands fa-apple"></span></a>
            </div>

            <div class="login__box">
                <p>Don't have an account? <a href="#">Sign up</a></p>
                <p><a href="#">Log in with your organization</a></p>
            </div>
        </div>

    </div>

</body>
</html>
